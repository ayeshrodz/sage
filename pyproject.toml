[project]
name = "sage"
version = "0.0.1"
description = "SAGE experiment 0: library economics on typed relational worlds"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]  # the stage 0c guide

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3"]  # the stage 1a model, in-process
ollama = ["psutil>=5"]  # the stage 1a model through a local Ollama server: counts the server's CPU time

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
